# Cấu hình Nginx Reverse Proxy cho tên miền: http://caplenhvr-sb.online
# Đặt file này tại: /etc/nginx/sites-available/caplenhvr-sb.online
# Kích hoạt: sudo ln -sf /etc/nginx/sites-available/caplenhvr-sb.online /etc/nginx/sites-enabled/caplenhvr-sb.online

upstream caplenh_vrsb_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name caplenhvr-sb.online www.caplenhvr-sb.online;

    # Giới hạn dung lượng upload lên 30MB (hỗ trợ tệp PDF/Ảnh 15MB mã hóa base64 qua JSON 25MB)
    client_max_body_size 30M;

    # Nén Gzip giúp tải nhanh giao diện trên mạng 4G di động ngoài đảo Lý Sơn
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Luồng SSE (Server-Sent Events) cho Trợ lý AI: tắt buffer để trả chữ theo thời gian thực
    location = /api/ai/chat-stream {
        proxy_pass http://caplenh_vrsb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # Toàn bộ API & Giao diện SPA (Vite dist qua server.ts)
    location / {
        proxy_pass http://caplenh_vrsb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
